name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # ChainDrop / Shai-Hulud: never run dependency lifecycle scripts in CI
      - name: Install (ignore-scripts)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Supply-chain worm audit (seed)
        run: npm run security:npm-audit-worm
