name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install (ignore-scripts)
        run: npm ci --ignore-scripts
      - name: Build bundled Gantt UI
        run: |
          npm --prefix apps/gantt-ui ci --ignore-scripts
          npm run gantt:build
      - name: Onboarding and startup checks
        run: npm run test:install
      - name: Inspect npm package contents
        run: npm run package:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # ChainDrop / Shai-Hulud: never run dependency lifecycle scripts in CI
      - name: Install (ignore-scripts)
        run: npm ci --ignore-scripts
      - name: Build bundled Gantt UI
        run: |
          npm --prefix apps/gantt-ui ci --ignore-scripts
          npm run gantt:build
      - name: Unit tests
        run: npm test
      - name: Supply-chain worm audit (seed)
        run: npm run security:npm-audit-worm
